<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Skin retro</title></head>
<body><header><span class="edition">VOLVIMOS AL CYBER</span><h1 id="brand"></h1><p id="description"></p></header>
<main><label class="switch-row"><span>Activar skin</span><input id="enabled" type="checkbox" role="switch"></label>
<label class="field">Colores<select id="theme" aria-label="Colores"></select></label>
<div id="random-theme-controls" hidden><p class="theme-help">Cada usuario tiene una paleta propia. Se conserva cuando volvés a visitarlo.</p><button id="shuffle-palettes" type="button">Mezclar paletas</button></div>
<label id="tagline-field" class="field">Frase de tu Fotolog<input id="tagline" type="text" maxlength="100" placeholder="..Siempre Queda Algo Por Jugar.."></label>
<label id="compact-field" class="switch-row"><span>Lista compacta de posts</span><input id="compact" type="checkbox"></label>
<p class="status" id="status" role="status" aria-live="polite"></p><a class="open" id="open" target="_blank" rel="noopener">Abrir</a>
<p class="privacy">Preferencias guardadas en tu navegador.<br>Sin cuentas nuevas, servidores ni analíticas.</p></main>
<footer>hecho para viajar en el tiempo :)</footer>
<script src="config.js"></script><script src="popup.js"></script></body></html>
